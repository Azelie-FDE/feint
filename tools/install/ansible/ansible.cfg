# The connection is Incus, not ssh: no key to place, no sshd to wait for, and no
# ~/.ssh/config of the operator's to interfere. This project has already lost an
# hour to the last one — a ProxyJump on a broad Host pattern swallowing the
# runtime's private range, which looks exactly like an absent ssh daemon.
[defaults]
inventory = inventory.yml
host_key_checking = False
stdout_callback = yaml
interpreter_python = /usr/bin/python3

[inventory]
enable_plugins = cloud.terraform.terraform_provider
